<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>MetricActive Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

  <!-- Root layout container for HTMX partials -->
  <div id="appScreen">

    <!-- Mobile Header -->
    <header class="mobile-header">
      <div class="logo-mobile">
        <i class="fas fa-shield-haltered"></i>
        <span>MetricActive</span>
      </div>
      <div class="mobile-header-actions">
        <button class="icon-btn" id="mobileThemeToggle" title="Toggle theme">
          <i class="fas fa-moon"></i>
        </button>
        <button class="icon-btn" hx-post="/logout" hx-target="body" title="Logout">
          <i class="fas fa-sign-out-alt"></i>
        </button>
        <button class="icon-btn" id="hamburgerBtn" title="Menu">
          <i class="fas fa-bars"></i>
        </button>
      </div>
    </header>

    <div class="content-wrapper">
      <!-- Sidebar -->
      <aside class="sidebar" id="sidebar">
        <div class="logo">
          <i class="fas fa-shield-haltered"></i>
          <span>MetricActive</span>
        </div>

        <!-- HTMX Navigation Links -->
        <nav class="nav-menu">
          <a class="nav-item active" hx-get="/analytics" hx-target="#main-content" hx-push-url="true">
            <i class="fas fa-chart-line"></i> <span>Analytics</span>
          </a>
          <a class="nav-item" hx-get="/users" hx-target="#main-content" hx-push-url="true">
            <i class="fas fa-users"></i> <span>Users</span>
          </a>
        </nav>

        <div class="sidebar-bottom">
          <button class="theme-toggle-btn" id="desktopThemeToggle">
            <i class="fas fa-moon"></i>
            <span>Dark Mode</span>
            <div class="toggle-track"><div class="toggle-thumb"></div></div>
          </button>
          
          <div class="user-info-sidebar">
            <div class="user-avatar" id="userAvatar">JD</div>
            <div>
              <div style="font-weight:600;" id="userNameDisplay">John Doe</div>
              <div style="font-size:0.75rem; color:var(--sidebar-text-muted);">Admin</div>
            </div>
          </div>
          
          <button class="logout-btn" hx-post="/logout" hx-target="body">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </aside>

      <div class="sidebar-overlay" id="sidebarOverlay"></div>

      <!-- Main Dynamic Content Container -->
      <main class="main-content" id="main-content">
        <!-- Backend injects page content dynamically here (e.g., /analytics or /users) -->
      </main>
    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav">
      <div class="mobile-nav-items">
        <div class="mobile-nav-item active" hx-get="/analytics" hx-target="#main-content" hx-push-url="true">
          <i class="fas fa-chart-line"></i><span>Analytics</span>
        </div>
        <div class="mobile-nav-item" hx-get="/users" hx-target="#main-content" hx-push-url="true">
          <i class="fas fa-users"></i><span>Users</span>
        </div>
      </div>
    </nav>
  </div>

  <!-- Global Modal Slot -->
  <div class="modal" id="modal-container"></div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</body>
</html>
